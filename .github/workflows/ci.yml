name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies & Ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff

      - name: Lint with Ruff
        run: ruff check --config backend/pyproject.toml backend/orbi backend/tests

      - name: Pre-cache Tree-sitter grammars
        run: |
          python -c "from orbi.lang_packs import install_pack, is_pack_installed; install_pack('python'); install_pack('ts_js'); assert is_pack_installed('python') and is_pack_installed('ts_js'), 'Packs not detected on disk'"
        env:
          PYTHONPATH: backend

      - name: Run pytest test suite
        working-directory: backend
        run: pytest -v tests

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check bundle size budget (<= 105 KiB gzipped)
        run: |
          SIZE=$(gzip -c frontend/dist/assets/index-*.js | wc -c)
          echo "Main entry JS gzipped size: $SIZE bytes"
          if [ "$SIZE" -gt 107520 ]; then
            echo "Error: Main bundle size ($SIZE bytes) exceeds the 105 KiB (107520 bytes) budget!"
            exit 1
          fi
